  {key:"lettrage", label:"Lettrage", icon:"✉️"},
  {key:"pes",      label:"PES",      icon:"📤"},
];
const MONTHS_FR  = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const DAYS_SHORT = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const TVA_QUARTERS = [1,4,7,10];

// ─── Helpers ─────────────────────────────────────────────────────────────────
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const getCurrentMonthKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
};
const currentMonthFr = () => {
  const d = new Date();
  return `${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`;
};
const monthKeyToFr = mk => {
  if (!mk) return "—";
  const [y, m] = mk.split("-");
  return `${MONTHS_FR[parseInt(m)-1]} ${y}`;
};
const ordinal = n => n===1?"1er":`${n}`;
const fmtDate = ds => {
  if (!ds) return "—";
  const [y,m,d] = ds.split("-");
  return `${d}/${m}/${y}`;
};

// Annuel = pas de TVA
const hasTVA = row => (row.regime||"mensuel") !== "annuel";

// ─── TVA helpers ──────────────────────────────────────────────────────────────
const getNextTVADate = (row, refDateStr) => {
  if (!hasTVA(row)||!refDateStr||!row.tvaDayOfMonth) return null;
  const ref = new Date(refDateStr); ref.setHours(0,0,0,0);
  const day = parseInt(row.tvaDayOfMonth);
  const regime = row.regime||"mensuel";

  if (regime==="mensuel") {
    const last = new Date(ref.getFullYear(),ref.getMonth()+1,0).getDate();
    const tgt  = new Date(ref.getFullYear(),ref.getMonth(),Math.min(day,last));
    tgt.setHours(0,0,0,0); return tgt;
  }
  if (regime==="trimestriel") {
    const refM = ref.getMonth()+1;
    let qM = TVA_QUARTERS.find(m=>m>=refM), qY=ref.getFullYear();
    if(!qM){qM=TVA_QUARTERS[0];qY++;}
    const last=new Date(qY,qM,0).getDate();
    let tgt=new Date(qY,qM-1,Math.min(day,last)); tgt.setHours(0,0,0,0);
    if(tgt<ref){
      const idx=TVA_QUARTERS.indexOf(qM);
      const ni=(idx+1)%TVA_QUARTERS.length;
      qM=TVA_QUARTERS[ni]; if(ni===0)qY++;
      const last2=new Date(qY,qM,0).getDate();
      tgt=new Date(qY,qM-1,Math.min(day,last2)); tgt.setHours(0,0,0,0);
    }
    return tgt;
  }
  return null;
};
const daysUntilNext = (row,refDateStr) => {
  const tgt=getNextTVADate(row,refDateStr);
  if(!tgt||!refDateStr) return null;
  const ref=new Date(refDateStr); ref.setHours(0,0,0,0);
  return Math.ceil((tgt-ref)/86400000);
};

// ─── Compta helpers ───────────────────────────────────────────────────────────
const defaultTasksEnabled = () => Object.fromEntries(ALL_TASKS.map(t=>[t.key,true]));
const getComptaStatus = row => {
  const en=ALL_TASKS.filter(t=>row.tasksEnabled?.[t.key]);
  if(!en.length) return "none";
  const done=en.filter(t=>row.tasksDone?.[t.key]);
  if(!done.length) return "todo";
  if(done.length===en.length) return "done";
  return "progress";
};
const getRowStatus = (row,refDate) => {
  if(!row.docsRecu) return "nodoc";
  if(getComptaStatus(row)==="done") return "done";
  return "progress";
};

// ─── CSV ──────────────────────────────────────────────────────────────────────
const exportCSV = (rows, refDate) => {
  const h=["Client","Période","Docs","Compta","Régime","Prochain TVA","Jours rest.","Dernière relance","Notes"];
  const lines=[h.join(";"), ...rows.map(r=>{
    const cs=getComptaStatus(r);
    const csl=cs==="done"?"Validé":cs==="progress"?"En cours":cs==="todo"?"Non commencé":"—";
    const tgt=getNextTVADate(r,refDate);
    const days=daysUntilNext(r,refDate);
    const lastRel=[...(r.relances||[])].sort((a,b)=>b.date.localeCompare(a.date))[0];
    const tvaStr=!hasTVA(r)?"Annuel (sans TVA)":
      tgt?`${String(tgt.getDate()).padStart(2,"0")}/${String(tgt.getMonth()+1).padStart(2,"0")}/${tgt.getFullYear()}`:"—";
    return [r.client,r.periode,r.docsRecu?"Oui":"Non",csl,r.regime||"mensuel",tvaStr,
      days!==null?days:"—",lastRel?fmtDate(lastRel.date):"—",r.notes||""]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";");
  })];
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="dossiers.csv";a.click();
  URL.revokeObjectURL(url);
};

// ─── ComptaStatus ─────────────────────────────────────────────────────────────
function ComptaStatus({row}){
  const cs=getComptaStatus(row);
  const en=ALL_TASKS.filter(t=>row.tasksEnabled?.[t.key]);
  const done=en.filter(t=>row.tasksDone?.[t.key]);
  if(cs==="none") return <span style={{color:C.light,fontSize:12}}>Aucune tâche</span>;
  if(cs==="todo") return(
    <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",
      borderRadius:99,background:"#f0eeeb",color:C.muted,fontSize:11.5,fontWeight:700}}>
      <span style={{width:6,height:6,borderRadius:"50%",background:C.light,display:"inline-block"}}/>Non commencé
    </span>);
  if(cs==="done") return(
    <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",
      borderRadius:99,background:C.sageL,color:C.sageD,fontSize:11.5,fontWeight:700}}>
      <span style={{width:6,height:6,borderRadius:"50%",background:C.sage,display:"inline-block"}}/>Validé
    </span>);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:3}}>
      <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",
        borderRadius:99,background:C.lavL,color:"#7a6aa0",fontSize:11.5,fontWeight:700,width:"fit-content"}}>
        <span style={{width:6,height:6,borderRadius:"50%",background:C.lav,display:"inline-block"}}/>En cours
      </span>
      <div style={{fontSize:10.5,color:C.muted,paddingLeft:2}}>{done.length}/{en.length} tâches</div>
    </div>);
}

function DaysChip({days}){
  if(days===null||days===undefined) return <span style={{color:C.light}}>—</span>;
  if(days<0) return <span style={{color:C.muted,fontSize:12}}>{Math.abs(days)}j dépassé</span>;
  if(days===0) return <span style={{color:C.muted,fontSize:12}}>Aujourd'hui</span>;
  return <span style={{color:C.muted,fontSize:12}}>{days}j restant</span>;
}

function StatCard({icon,label,value,sub,color}){

// ─── Compta Modal ─────────────────────────────────────────────────────────────
function ComptaModal({row,onClose,onUpdate}){
  const [tasksDone,setTasksDone]=useState({...(row.tasksDone||{})});
  const en=ALL_TASKS.filter(t=>row.tasksEnabled?.[t.key]);
  const toggle=key=>{const n={...tasksDone,[key]:!tasksDone[key]};setTasksDone(n);onUpdate(row.id,n);};
  const cnt=en.filter(t=>tasksDone[t.key]).length;
  const pct=en.length?Math.round(cnt/en.length*100):0;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(30,25,20,.45)",zIndex:1000,display:"flex",
      alignItems:"center",justifyContent:"center",backdropFilter:"blur(3px)"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.card,borderRadius:20,padding:"30px 34px",width:420,maxWidth:"95vw",
        boxShadow:C.shadowLg,animation:"slideUp .22s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
          <div>
            <div style={{fontFamily:"'Lora',serif",fontSize:18,fontWeight:600,fontStyle:"italic"}}>Comptabilité</div>
            <div style={{fontSize:13,color:C.muted,marginTop:2,fontWeight:600}}>{row.client}</div>
          </div>
          <button onClick={onClose} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,
            width:32,height:32,cursor:"pointer",fontSize:16,color:C.muted,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>
        <div style={{marginBottom:22}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
            <span style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:.8}}>Avancement</span>
            <span style={{fontSize:18,fontWeight:700,fontFamily:"'Lora',serif",color:pct===100?C.sage:C.text}}>{pct}%</span>
          </div>
          <div style={{background:C.border,borderRadius:99,height:6}}>
            <div style={{height:6,borderRadius:99,width:`${pct}%`,transition:"width .4s ease",
              background:pct===100?`linear-gradient(90deg,${C.sage},#a8c9b0)`:`linear-gradient(90deg,${C.lav},${C.blue})`}}/>
          </div>
          <div style={{fontSize:11,color:C.light,marginTop:5}}>{cnt}/{en.length} tâches complétées</div>
        </div>
        {en.length===0?(
          <div style={{textAlign:"center",color:C.light,fontSize:13,padding:"20px 0"}}>Aucune tâche configurée.</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {en.map(task=>{
              const done=!!tasksDone[task.key];
              return(
                <div key={task.key} onClick={()=>toggle(task.key)}
                  style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                    padding:"12px 16px",borderRadius:12,cursor:"pointer",transition:"all .16s",
                    background:done?C.sageL:C.bg,border:`1.5px solid ${done?"#cde0d3":C.border}`}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:18}}>{task.icon}</span>
                    <span style={{fontSize:14,fontWeight:600,color:done?C.sageD:C.text}}>{task.label}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    {done&&<span style={{fontSize:11,color:C.sage,fontWeight:700}}>Fait</span>}
                    <div style={{width:34,height:19,borderRadius:99,background:done?C.sage:C.border,
                      position:"relative",flexShrink:0,transition:"all .22s"}}>
                      <div style={{position:"absolute",top:3,left:done?18:3,width:13,height:13,borderRadius:"50%",
                        background:"#fff",boxShadow:"0 1px 3px rgba(0,0,0,.18)",transition:"left .22s"}}/>
                    </div>
                  </div>
                </div>);
            })}
          </div>
        )}
        <div style={{marginTop:20,textAlign:"right"}}>
          <button onClick={onClose} style={{padding:"9px 22px",borderRadius:10,border:"none",background:C.sage,
            color:"#fff",fontWeight:700,fontSize:14,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>Fermer</button>
        </div>
      </div>
    </div>);
}

function RelancesModal({row,onClose,onUpdate}){

// ─── Calendar View ────────────────────────────────────────────────────────────
function CalendarView({rows,refDate}){
  const ref0=new Date(refDate);ref0.setHours(0,0,0,0);
  const [cy,setCy]=useState(ref0.getFullYear());
  const [cm,setCm]=useState(ref0.getMonth());
  const todayD=new Date();todayD.setHours(0,0,0,0);
  const prevMonth=()=>{if(cm===0){setCy(y=>y-1);setCm(11);}else setCm(m=>m-1);};
  const nextMonth=()=>{if(cm===11){setCy(y=>y+1);setCm(0);}else setCm(m=>m+1);};
  const daysInMonth=new Date(cy,cm+1,0).getDate();
  const firstDow=(new Date(cy,cm,1).getDay()+6)%7;
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  const calRef=`${cy}-${String(cm+1).padStart(2,"0")}-01`;
  const dayMap={};
  rows.filter(r=>hasTVA(r)).forEach(row=>{
    const tgt=getNextTVADate(row,calRef);
    if(!tgt||tgt.getFullYear()!==cy||tgt.getMonth()!==cm) return;
    const d=tgt.getDate();
    if(!dayMap[d]) dayMap[d]=[];
    const refD=new Date(refDate);refD.setHours(0,0,0,0);
    dayMap[d].push({row,days:Math.ceil((tgt-refD)/86400000)});
  });
  const regColor={mensuel:C.blue,trimestriel:C.lav};
  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:"24px",boxShadow:C.shadow}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <button onClick={prevMonth} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,width:34,height:34,cursor:"pointer",fontSize:16,color:C.muted}}>‹</button>
        <div style={{fontFamily:"'Lora',serif",fontSize:18,fontWeight:600}}>{MONTHS_FR[cm]} {cy}</div>
        <button onClick={nextMonth} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,width:34,height:34,cursor:"pointer",fontSize:16,color:C.muted}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {DAYS_SHORT.map(d=>(
          <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:C.light,textTransform:"uppercase",letterSpacing:.8,padding:"4px 0"}}>{d}</div>))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
        {cells.map((day,i)=>{
          if(!day) return <div key={`e${i}`}/>;
          const isToday=day===todayD.getDate()&&cm===todayD.getMonth()&&cy===todayD.getFullYear();
          const entries=dayMap[day]||[];
          return(
            <div key={day} style={{minHeight:70,borderRadius:10,padding:"6px",
              background:isToday?"#f0f7f2":entries.length?"#fefefe":C.bg,
              border:`1.5px solid ${isToday?C.sage:entries.length?C.border:C.borderL}`}}>
              <div style={{fontSize:12,fontWeight:700,color:isToday?C.sage:C.muted,marginBottom:4,textAlign:"right"}}>{day}</div>
              <div style={{display:"flex",flexDirection:"column",gap:2}}>
                {entries.map(({row,days})=>(
                  <div key={row.id}
                    title={`${row.client} — ${row.regime} — ${days>=0?`${days}j restant`:`${Math.abs(days)}j dépassé`}`}
                    style={{fontSize:10,fontWeight:700,padding:"2px 5px",borderRadius:4,lineHeight:1.4,
                      background:(regColor[row.regime]||C.blue)+"22",color:regColor[row.regime]||C.blue,
                      overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",
                      border:`1px solid ${(regColor[row.regime]||C.blue)}44`,cursor:"default"}}>
                    {row.client.split(" ")[0]}
                  </div>))}
              </div>
            </div>);
        })}
      </div>
      <div style={{display:"flex",gap:16,marginTop:16,flexWrap:"wrap"}}>
        {[{color:C.blue,label:"Mensuel"},{color:C.lav,label:"Trimestriel"}].map(({color,label})=>(
          <div key={label} style={{display:"flex",alignItems:"center",gap:6,fontSize:11.5,color:C.muted}}>
            <div style={{width:10,height:10,borderRadius:3,background:color+"44",border:`1.5px solid ${color}`}}/>{label}
          </div>))}
        <div style={{fontSize:11.5,color:C.light,marginLeft:"auto"}}>Clients annuels non affichés (pas de TVA)</div>
      </div>
    </div>);
}

  const [deleteId,setDeleteId] =useState(null);
  const [sortBy,setSortBy]     =useState("client");
  const [sortDir,setSortDir]   =useState("asc");

  useEffect(()=>{saveData({rows,nextId,refDate,lastResetMonth:getCurrentMonthKey()});},[rows,nextId,refDate]);

  const openAdd  =()=>{setForm(EMPTY_FORM());setModal("add");};
  const openEdit =row=>{setForm({...row,tasksEnabled:{...row.tasksEnabled},tasksDone:{...row.tasksDone}});setModal("edit");};
  const closeModal=()=>setModal(null);
  const handleSave=()=>{
    if(!form.client.trim()) return;
    if(modal==="add"){setRows(r=>[...r,{...form,id:nextId,monthHistory:[]}]);setNextId(n=>n+1);}
    else setRows(r=>r.map(row=>row.id===form.id?{...form,monthHistory:row.monthHistory||[]}:row));
    closeModal();
  };
  const handleDelete    =()=>{setRows(r=>r.filter(row=>row.id!==deleteId));setDeleteId(null);};
  const toggleDocs      =id=>setRows(r=>r.map(row=>row.id===id?{...row,docsRecu:!row.docsRecu}:row));
  const updateTasksDone =(id,td)=>setRows(r=>r.map(row=>row.id===id?{...row,tasksDone:td}:row));
  const updateRelances  =(id,rel)=>setRows(r=>r.map(row=>row.id===id?{...row,relances:rel}:row));

  const stats=useMemo(()=>({
    total:    rows.length,
    done:     rows.filter(r=>getRowStatus(r,refDate)==="done").length,
    progress: rows.filter(r=>getComptaStatus(r)==="progress").length,
    noDoc:    rows.filter(r=>!r.docsRecu).length,
    relances: rows.reduce((s,r)=>s+(r.relances||[]).length,0),
  }),[rows,refDate]);

  const FILTERS=[
    {key:"all",         label:"Tous"},
    {key:"noDoc",       label:"📥 Sans docs"},
    {key:"compta",      label:"📊 Compta en attente"},
    {key:"progress",    label:"⏳ En cours"},
    {key:"relances",    label:"📞 Avec relances"},
    {key:"done",        label:"✅ Terminés"},
    {key:"mensuel",     label:"📅 Mensuel"},
    {key:"trimestriel", label:"📅 Trim."},
    {key:"annuel",      label:"📅 Annuel"},
  ];

  const filtered=useMemo(()=>{
    let data=[...rows];
    if(search) data=data.filter(r=>
      r.client.toLowerCase().includes(search.toLowerCase())||
      r.periode.toLowerCase().includes(search.toLowerCase()));
    if(filter==="noDoc")       data=data.filter(r=>!r.docsRecu);
    if(filter==="done")        data=data.filter(r=>getRowStatus(r,refDate)==="done");
    if(filter==="compta")      data=data.filter(r=>getComptaStatus(r)!=="done");
    if(filter==="progress")    data=data.filter(r=>getComptaStatus(r)==="progress");
    if(filter==="relances")    data=data.filter(r=>(r.relances||[]).length>0);
    if(filter==="mensuel")     data=data.filter(r=>(r.regime||"mensuel")==="mensuel");
    if(filter==="trimestriel") data=data.filter(r=>r.regime==="trimestriel");
    if(filter==="annuel")      data=data.filter(r=>r.regime==="annuel");
    data.sort((a,b)=>{
      let va,vb;
      if(sortBy==="jours"){va=daysUntilNext(a,refDate)??99999;vb=daysUntilNext(b,refDate)??99999;}
      else if(sortBy==="compta"){const o={todo:0,progress:1,done:2,none:3};va=o[getComptaStatus(a)];vb=o[getComptaStatus(b)];}
      else{va=(a[sortBy]??"").toString().toLowerCase();vb=(b[sortBy]??"").toString().toLowerCase();}
      if(va<vb) return sortDir==="asc"?-1:1;
      if(va>vb) return sortDir==="asc"?1:-1;
      return 0;
    });
    return data;
  },[rows,search,filter,sortBy,sortDir,refDate]);

  const setSort=col=>{if(sortBy===col)setSortDir(d=>d==="asc"?"desc":"asc");else{setSortBy(col);setSortDir("asc");}};
  const SI=col=>sortBy===col?(sortDir==="asc"?"↑":"↓"):"";
  const TH=({label,col,noSort})=>(
    <th onClick={noSort?undefined:()=>setSort(col)}
      style={{padding:"12px 13px",textAlign:"left",fontSize:11,fontWeight:700,color:C.light,
        letterSpacing:1,textTransform:"uppercase",cursor:noSort?"default":"pointer",userSelect:"none",whiteSpace:"nowrap"}}
      onMouseEnter={e=>{if(!noSort)e.currentTarget.style.color=C.muted;}}
      onMouseLeave={e=>{e.currentTarget.style.color=C.light;}}>
      {label}{!noSort&&SI(col)?` ${SI(col)}`:""}
    </th>);

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Nunito',sans-serif",color:C.text}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;1,400&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        ::-webkit-scrollbar{width:5px;height:5px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:#e8e3dc;border-radius:99px;}
        @keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .fade-in{animation:fadeIn .22s ease;}
        .tr-row{transition:background .12s;}
        .tr-row:hover{background:#faf9f7 !important;}
        .tr-row:hover .act-btns{opacity:1!important;}
        .compta-cell{cursor:pointer;transition:all .15s;}
        .compta-cell:hover{transform:scale(1.03);}
      `}</style>

      {/* Header */}
      <div style={{background:C.card,borderBottom:`1px solid ${C.border}`,padding:"14px 28px",
        display:"flex",alignItems:"center",justifyContent:"space-between",
        boxShadow:C.shadow,position:"sticky",top:0,zIndex:100,gap:12,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:13}}>
          <div style={{width:42,height:42,background:C.sageL,borderRadius:12,border:"1.5px solid #cde0d3",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📒</div>
          <div>
            <div style={{fontFamily:"'Lora',serif",fontSize:19,fontWeight:600}}>Cabinet Comptable</div>
            <div style={{fontSize:11,color:C.light,marginTop:1}}>Suivi mensuel — {currentMonthFr()}</div>
          </div>
        </div>
        <DateRefPicker refDate={refDate} setRefDate={setRefDate}/>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={()=>exportCSV(filtered,refDate)}
            style={{padding:"8px 14px",borderRadius:9,border:`1px solid ${C.border}`,
              background:"transparent",cursor:"pointer",color:C.muted,fontSize:12.5,fontFamily:"inherit",fontWeight:600}}>
            ⬇ CSV
          </button>
          <button onClick={openAdd}
            style={{padding:"9px 18px",borderRadius:10,border:"none",background:C.sage,cursor:"pointer",
              color:"#fff",fontSize:13.5,fontFamily:"inherit",fontWeight:700,
              boxShadow:`0 3px 10px ${C.sage}44`,display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:16}}>+</span> Nouveau dossier
          </button>
        </div>
      </div>

      <div style={{maxWidth:1440,margin:"0 auto",padding:"26px 24px"}}>

        {/* Stats */}
        <div style={{display:"flex",gap:12,marginBottom:24,flexWrap:"wrap"}}>
          <StatCard icon="📁" label="Dossiers"       value={stats.total}    color={C.text}/>
          <StatCard icon="✅" label="Terminés"        value={stats.done}
            sub={stats.total?Math.round(stats.done/stats.total*100)+"% complétés":""} color={C.sage}/>
          <StatCard icon="⏳" label="Compta en cours" value={stats.progress} color={C.lav}/>
          <StatCard icon="📥" label="Docs manquants"  value={stats.noDoc}
            color={stats.noDoc>0?C.orange:C.muted}/>
          <StatCard icon="📞" label="Relances"        value={stats.relances}
            sub="cumulées (toutes périodes)" color={C.blue}/>
        </div>

        {/* Toolbar */}
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{position:"relative",flex:"1 1 200px",maxWidth:280}}>
            <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",fontSize:14,color:C.light}}>🔍</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher un client…"
              style={{width:"100%",background:C.card,border:`1.5px solid ${C.border}`,borderRadius:10,
                padding:"8px 12px 8px 33px",fontSize:13,fontFamily:"inherit",color:C.text,outline:"none",transition:"border .15s"}}
              onFocus={e=>e.target.style.borderColor=C.sage} onBlur={e=>e.target.style.borderColor=C.border}/>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {FILTERS.map(f=>(
              <button key={f.key} onClick={()=>setFilter(f.key)}
                style={{padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",
                  fontFamily:"inherit",transition:"all .15s",
                  border:filter===f.key?`1.5px solid ${C.text}`:"1.5px solid transparent",
                  background:filter===f.key?C.text:C.card,
                  color:filter===f.key?"#fff":C.muted}}>
                {f.label}
              </button>))}
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
            <span style={{fontSize:12,color:C.muted}}>{filtered.length} résultat{filtered.length!==1?"s":""}</span>
            <div style={{display:"flex",background:C.card,border:`1px solid ${C.border}`,borderRadius:9,overflow:"hidden"}}>
              {[{v:"table",icon:"☰"},{v:"calendar",icon:"📅"}].map(({v,icon})=>(
                <button key={v} onClick={()=>setView(v)}
                  style={{padding:"7px 13px",border:"none",cursor:"pointer",fontSize:13,
                    fontFamily:"inherit",background:view===v?C.sage:"transparent",
                    color:view===v?"#fff":C.muted,transition:"all .15s",fontWeight:600}}>
                  {icon}
                </button>))}
            </div>
          </div>
        </div>

        {/* Calendar */}
        {view==="calendar"&&(
          <div className="fade-in" style={{marginBottom:24}}>
            <CalendarView rows={rows} refDate={refDate}/>
          </div>)}

        {/* Table */}
        {view==="table"&&(
          <div className="fade-in" style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,
            overflow:"hidden",boxShadow:C.shadow}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:980}}>
                <thead>
                  <tr style={{background:"#faf8f5",borderBottom:`1px solid ${C.border}`}}>
                    <TH label="Client"       col="client"/>
                    <TH label="Période"      col="periode"/>
                    <TH label="📥 Docs"      col="docsRecu"/>
                    <TH label="📊 Compta"    col="compta"/>
                    <TH label="Régime"       col="regime"/>
                    <TH label="Prochain TVA" col="jours"/>
                    <TH label="📞 Relance"   noSort/>
                    <TH label="Notes"        noSort/>
                    <TH label="🕓 Historique" noSort/>
                    <TH label="Actions"      noSort/>
                  </tr>
                </thead>
                <tbody>
                  {filtered.length===0&&(
                    <tr><td colSpan={10} style={{padding:"48px 20px",textAlign:"center",color:C.light,fontSize:14}}>
                      Aucun dossier trouvé.
                    </td></tr>)}
                  {filtered.map(row=>{
                    const rs       =getRowStatus(row,refDate);
                    const days     =daysUntilNext(row,refDate);
                    const tgt      =getNextTVADate(row,refDate);
                    const rowBg    =rs==="done"?"#f5faf6":C.card;
                    const regColor ={mensuel:C.blue,trimestriel:C.lav,annuel:C.teal}[row.regime||"mensuel"];
                    const lastRel  =[...(row.relances||[])].sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
                    const histCount=(row.monthHistory||[]).length;
                    return(
                      <tr key={row.id} className="tr-row fade-in"
                        style={{borderBottom:`1px solid ${C.borderL}`,background:rowBg}}>

                        <td style={{padding:"12px 13px",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>{row.client}</td>
                        <td style={{padding:"12px 13px",fontSize:13,color:C.muted,whiteSpace:"nowrap"}}>{row.periode}</td>

                        {/* Docs bouton */}
                        <td style={{padding:"12px 13px"}}>
                          <button onClick={()=>toggleDocs(row.id)}
                            style={{padding:"5px 12px",borderRadius:20,
                              border:`1.5px solid ${row.docsRecu?"#cde0d3":C.border}`,
                              background:row.docsRecu?C.sageL:C.bg,
                              color:row.docsRecu?C.sageD:C.muted,
                              fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",
                              display:"inline-flex",alignItems:"center",gap:5,
                              transition:"all .18s",whiteSpace:"nowrap"}}>
                            {row.docsRecu
                              ?<><span style={{fontSize:11}}>✓</span> Reçus</>
                              :<><span style={{fontSize:11}}>○</span> En attente</>}
                          </button>
                        </td>

                        {/* Compta */}
                        <td style={{padding:"12px 13px"}}>
                          <div className="compta-cell" onClick={()=>setComptaRow(row)}>
                            <ComptaStatus row={row}/>
                            <div style={{fontSize:10,color:C.light,marginTop:2}}>Cliquer →</div>
                          </div>
                        </td>

                        {/* Régime */}
                        <td style={{padding:"12px 13px"}}>
                          <span style={{fontSize:11.5,fontWeight:700,padding:"3px 9px",borderRadius:99,
                            background:regColor+"18",color:regColor,border:`1px solid ${regColor}33`,whiteSpace:"nowrap"}}>
                            {row.regime==="mensuel"?"Mensuel":row.regime==="trimestriel"?"Trim.":"Annuel"}
                          </span>
                        </td>

                        {/* Prochain TVA */}
                        <td style={{padding:"12px 13px"}}>
                          {!hasTVA(row)?(
                            <span style={{fontSize:12,color:C.light,fontStyle:"italic"}}>Sans TVA</span>
                          ):tgt?(
                            <div>
                              <div style={{fontSize:12.5,color:C.text,fontWeight:600,whiteSpace:"nowrap"}}>
                                {String(tgt.getDate()).padStart(2,"0")}/{String(tgt.getMonth()+1).padStart(2,"0")}/{tgt.getFullYear()}
                              </div>
                              <div style={{marginTop:2}}><DaysChip days={days}/></div>
                            </div>
                          ):<span style={{color:C.light}}>—</span>}
                        </td>

                        {/* Relances */}
                        <td style={{padding:"12px 13px"}}>
                          <button onClick={()=>setRelancesRow(row)}
                            style={{padding:"5px 10px",borderRadius:7,
                              border:`1px solid ${lastRel?C.blue:C.border}`,
                              background:lastRel?C.blueL:C.bg,color:lastRel?C.blue:C.light,
                              fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",
                              display:"inline-flex",alignItems:"center",gap:5,transition:"all .15s",whiteSpace:"nowrap"}}>
                            <span>📞</span>
                            {lastRel
                              ?<span>{fmtDate(lastRel.date)}</span>
                              :<span style={{fontWeight:400}}>—</span>}
                          </button>
                        </td>

                        {/* Notes */}
                        <td style={{padding:"12px 13px"}}><NotesCell notes={row.notes}/></td>

                        {/* Historique */}
                        <td style={{padding:"12px 13px"}}>
                          <button onClick={()=>setHistoryRow(row)}
                            title={histCount>0?`${histCount} mois archivé${histCount>1?"s":""}`:"Aucun historique encore"}
                            style={{padding:"5px 10px",borderRadius:7,
                              border:`1px solid ${histCount>0?C.border:C.borderL}`,
                              background:histCount>0?"#faf8f5":C.bg,
                              color:histCount>0?C.muted:C.light,
                              fontSize:12,fontWeight:histCount>0?700:400,cursor:"pointer",fontFamily:"inherit",
                              display:"inline-flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
                            🕓 {histCount>0?`${histCount} mois`:"—"}
                          </button>
                        </td>

                        {/* Actions */}
                        <td style={{padding:"12px 13px"}}>
                          <div className="act-btns" style={{display:"flex",gap:4,opacity:0,transition:"opacity .14s"}}>
                            <button onClick={()=>openEdit(row)}
                              style={{padding:"5px 9px",borderRadius:7,border:`1px solid ${C.border}`,
                                cursor:"pointer",fontSize:13,color:C.muted,background:C.bg}}>✏️</button>
                            <button onClick={()=>setDeleteId(row.id)}
                              style={{padding:"5px 9px",borderRadius:7,border:"1px solid #f0c0c0",
                                cursor:"pointer",fontSize:13,color:C.red,background:C.redL}}>🗑️</button>
                          </div>
                        </td>
                      </tr>);
                  })}
                </tbody>
              </table>
            </div>
          </div>)}

        {/* Legend */}
        <div style={{marginTop:16,display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
          {[
            {color:C.sage, label:"Terminé"},
            {color:C.blue, label:"Mensuel TVA"},
            {color:C.lav,  label:"Trimestriel TVA"},
            {color:C.teal, label:"Annuel — sans TVA mensuelle"},
          ].map(({color,label})=>(
            <div key={label} style={{display:"flex",alignItems:"center",gap:5,fontSize:11.5,color:C.muted}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:color}}/>{label}
            </div>))}
          <div style={{marginLeft:"auto",fontSize:11,color:C.light}}>
            Archivage automatique fin de mois • Relances conservées • 🕓 Historique complet
          </div>
        </div>
      </div>

      {/* Modals */}
      {comptaRow&&(
        <ComptaModal row={rows.find(r=>r.id===comptaRow.id)||comptaRow}
          onClose={()=>setComptaRow(null)} onUpdate={updateTasksDone}/>)}
      {relancesRow&&(
        <RelancesModal row={rows.find(r=>r.id===relancesRow.id)||relancesRow}
          onClose={()=>setRelancesRow(null)} onUpdate={updateRelances}/>)}
      {historyRow&&(
        <HistoryModal row={rows.find(r=>r.id===historyRow.id)||historyRow}
          onClose={()=>setHistoryRow(null)}/>)}
      {(modal==="add"||modal==="edit")&&(
        <DossierModal form={form} setForm={setForm} onSave={handleSave} onClose={closeModal} isEdit={modal==="edit"}/>)}
      {deleteId!==null&&(
        <div style={{position:"fixed",inset:0,background:"rgba(30,25,20,.45)",zIndex:1000,display:"flex",
          alignItems:"center",justifyContent:"center",backdropFilter:"blur(3px)"}}
          onClick={e=>e.target===e.currentTarget&&setDeleteId(null)}>
          <div style={{background:C.card,borderRadius:16,padding:"28px 32px",width:360,textAlign:"center",
            boxShadow:C.shadowLg,animation:"slideUp .2s ease"}}>
            <div style={{fontSize:32,marginBottom:12}}>🗑️</div>
            <h4 style={{fontFamily:"'Lora',serif",fontSize:17,fontWeight:600,marginBottom:8}}>Supprimer ce dossier ?</h4>
            <p style={{fontSize:13,color:C.muted,marginBottom:22}}>Cette action est irréversible.</p>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button onClick={()=>setDeleteId(null)}
                style={{padding:"9px 20px",borderRadius:9,border:`1px solid ${C.border}`,background:"transparent",
                  cursor:"pointer",color:C.muted,fontSize:14,fontFamily:"inherit",fontWeight:600}}>Annuler</button>
              <button onClick={handleDelete}
                style={{padding:"9px 20px",borderRadius:9,border:"none",background:C.red,cursor:"pointer",
                  color:"#fff",fontSize:14,fontFamily:"inherit",fontWeight:700}}>Supprimer</button>
            </div>
          </div>
        </div>)}
    </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
